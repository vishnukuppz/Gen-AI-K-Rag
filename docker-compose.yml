services:
  # Streamlit Knowledge RAG Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krag-streamlit-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Direct connection to the Neo4j container via Docker internal network
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_GENERATIVE_MODEL=${OPENAI_GENERATIVE_MODEL:-gpt-4o-mini}
    volumes:
      # Mount current directory for real-time development reloading
      - ./:/app
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - krag-network

  # Neo4j Graph Database Service
  neo4j:
    image: neo4j:5-community
    container_name: krag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser Web Interface
      - "7687:7687" # Bolt Protocol Port
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - krag-network

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  krag-network:
    driver: bridge
